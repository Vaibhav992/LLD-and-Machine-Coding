spring.application.name=machine-coding

# File-based H2 so data survives a restart. Delete ./data/ to start clean.
spring.datasource.url=jdbc:h2:file:./data/machinecoding;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# http://localhost:8080/h2-console  (JDBC URL above, user sa, empty password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
